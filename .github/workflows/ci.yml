name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install ruff
        run: pip install ruff
      - name: Lint
        run: ruff check .

  tests-cpu:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        # GPU 不可用的云端环境：gpu 标记的用例自动跳过。
        # 用 pyproject 安装路径（含 pillow 等测试依赖），持续验证打包完整性
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Run CPU tests
        run: python -m pytest tests/ -m "not gpu"

  tests-gpu:
    # 自托管 GPU runner（注册方法见 docs/ci.md）：
    # 1. 在 GPU 机器上注册 runner，标签含 self-hosted / windows / gpu
    # 2. 在仓库 Settings → Secrets and variables → Actions → Variables
    #    创建变量 MYOPTICS_GPU_RUNNER = 1 启用本 job
    # 3. 创建变量 MYOPTICS_VENV_PYTHON 指向已装好依赖的 python.exe
    #    （例如 D:\...\MyOptics\.venv\Scripts\python.exe）
    needs: [lint, tests-cpu]
    runs-on: [self-hosted, windows, gpu]
    if: vars.MYOPTICS_GPU_RUNNER == '1'
    steps:
      - uses: actions/checkout@v4
      - name: Run GPU tests
        shell: pwsh
        run: |
          if (-not $env:MYOPTICS_VENV_PYTHON) {
            Write-Host '##vso[task.logissue type=warning]MYOPTICS_VENV_PYTHON 未设置，跳过 GPU 测试'
            exit 0
          }
          & $env:MYOPTICS_VENV_PYTHON -m pytest tests/ -m gpu
