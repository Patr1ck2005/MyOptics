site_name: MyOptics
site_description: Fourier optics simulation framework (angular spectrum method, GPU-accelerated)
repo_url: https://github.com/Patr1ck2005/MyOptics

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
  features:
    - navigation.sections
    - content.code.copy

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_source: true

markdown_extensions:
  - admonition
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight
  - pymdownx.superfences
  - toc:
      permalink: true

nav:
  - 首页: index.md
  - 快速上手: quickstart.md
  - 物理指南:
      - 角谱传播: physics/angular-spectrum.md
      - 多层膜 TMM 与传函耦合: physics/multilayer-tmm.md
      - 矢量光学: physics/vector-optics.md
      - 宽谱与参数扫描: physics/broadband-workflows.md
  - 基准测试: benchmark.md
  - API 参考:
      - OpticalSystem: api/system.md
      - 元件库: api/elements.md
      - 传播器: api/propagator.md
      - 多层膜 TMM: api/tmm.md
      - 矢量引擎: api/vector.md
      - 工作流层: api/workflows.md
  - 开发:
      - CI 与自托管 runner: ci.md
      - 开发流程: development.md
      - 审计报告: audit.md
